{% extends "base.html" %}
{% block title %}Add Plant · GardenPal{% endblock %}

{% block content %}
  <a href="{{ url_for('garden_index') }}" class="back-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Edibles
  </a>

  <div class="panel stack" style="overflow:visible">
    <h2 style="margin-bottom:4px">Add Plant</h2>
    <form method="post" action="{{ url_for('garden_new') }}" class="stack">
      <label>
        Plant name *
        <div style="position:relative">
          <input id="plant-name-input" type="text" name="plant_name"
                 value="{{ form_values.plant_name or '' }}" placeholder="e.g. Zucchini" required
                 autocomplete="off" autocorrect="off"
                 data-plant-names='{{ plant_names | tojson }}'
                 data-plant-varieties='{{ plant_varieties | tojson }}' />
          <ul id="plant-name-dropdown" class="tag-autocomplete-dropdown" hidden></ul>
        </div>
      </label>
      <label>
        Variety
        <div style="position:relative">
          <input id="variety-input" type="text" name="variety"
                 value="{{ form_values.variety or '' }}" placeholder="e.g. Black Beauty"
                 autocomplete="off" autocorrect="off" />
          <ul id="variety-dropdown" class="tag-autocomplete-dropdown" hidden></ul>
        </div>
      </label>
      {% if feature_garden_zones %}
      <label>
        Zone
        <div style="position:relative">
          <input id="zone-name-input" type="text" name="zone_name"
                 value="{{ form_values.zone_name or '' }}"
                 placeholder="e.g. Raised bed 1, Greenhouse…"
                 autocomplete="off" autocorrect="off"
                 data-zones='{{ zones_json | tojson }}' />
          <input type="hidden" name="zone_id" id="zone-id-hidden" value="{{ form_values.zone_id or '' }}" />
          <ul id="zone-name-dropdown" class="tag-autocomplete-dropdown" hidden></ul>
        </div>
      </label>
      {% endif %}
      <label>
        Bed / location
        <select id="bed-select" hidden data-zone-beds='{{ (zone_beds or {}) | tojson }}'></select>
        <div style="position:relative" id="loc-name-wrap">
          <input id="loc-name-input" type="text" name="location_name"
                 value="{{ form_values.location_name or '' }}"
                 placeholder="e.g. North bed, big pot on deck…"
                 autocomplete="off" autocorrect="off"
                 data-locations='{{ location_names | tojson }}' />
          <ul id="loc-name-dropdown" class="tag-autocomplete-dropdown" hidden></ul>
        </div>
      </label>
      <label>
        <span>Spot in bed <span style="text-transform:none;letter-spacing:0;font-weight:400">(optional)</span></span>
        <input id="bed-spot-input" type="text" name="bed_spot" maxlength="80"
               value="{{ form_values.bed_spot or '' }}"
               placeholder="e.g. north end, by the trellis"
               autocomplete="off" />
      </label>
      <label id="location-type-field">
        Location type
        <select name="location_type">
          <option value="">Choose…</option>
          <option value="raised_bed"  {% if form_values.location_type == "raised_bed"  %}selected{% endif %}>Raised bed</option>
          <option value="container"   {% if form_values.location_type == "container"   %}selected{% endif %}>Container</option>
          <option value="in_ground"   {% if form_values.location_type == "in_ground"   %}selected{% endif %}>In ground</option>
          <option value="greenhouse"  {% if form_values.location_type == "greenhouse"  %}selected{% endif %}>Greenhouse</option>
          <option value="grow_bag"    {% if form_values.location_type == "grow_bag"    %}selected{% endif %}>Grow bag</option>
          <option value="other"       {% if form_values.location_type == "other"       %}selected{% endif %}>Other</option>
        </select>
      </label>
      <label>
        Date planted
        <input type="date" name="planted_date" value="{{ form_values.planted_date or '' }}" />
      </label>
      <label>
        Started from
        <select name="planting_method">
          <option value="">Choose…</option>
          <option value="direct_sow"      {% if form_values.planting_method == "direct_sow"      %}selected{% endif %}>Direct sow</option>
          <option value="seed_transplant" {% if form_values.planting_method == "seed_transplant" %}selected{% endif %}>Seed transplant</option>
          <option value="young_plant"     {% if form_values.planting_method == "young_plant"     %}selected{% endif %}>Young plant / starts</option>
        </select>
      </label>
      <label>
        Notes
        <textarea name="notes" rows="3" placeholder="Seed source, spacing, observations…">{{ form_values.notes or '' }}</textarea>
      </label>
      <button type="submit" style="margin-top:4px">Save to Edibles</button>
    </form>
  </div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  var inp = document.getElementById('zone-name-input');
  var hiddenId = document.getElementById('zone-id-hidden');
  var dropdown = document.getElementById('zone-name-dropdown');
  if (!inp || !dropdown) return;
  var zones = [];
  try { zones = JSON.parse(inp.dataset.zones || '[]'); } catch(e) {}
  function show(q) {
    q = (q || '').trim().toLowerCase();
    var matches = q ? zones.filter(function(z) { return z.name.toLowerCase().includes(q); }) : zones;
    if (!matches.length) { dropdown.hidden = true; return; }
    dropdown.innerHTML = '';
    matches.forEach(function(zone) {
      var li = document.createElement('li');
      li.textContent = zone.name;
      function pick() {
        inp.value = zone.name; dropdown.hidden = true;
        if (hiddenId) { hiddenId.value = zone.id; hiddenId.dispatchEvent(new Event('change')); }
      }
      li.addEventListener('mousedown', function(e) { e.preventDefault(); pick(); });
      li.addEventListener('touchstart', function(e) { e.preventDefault(); pick(); inp.blur(); });
      dropdown.appendChild(li);
    });
    dropdown.hidden = false;
  }
  inp.addEventListener('focus', function() { show(inp.value); });
  inp.addEventListener('input', function() {
    if (hiddenId && hiddenId.value) { hiddenId.value = ''; hiddenId.dispatchEvent(new Event('change')); }
    show(inp.value);
  });
  inp.addEventListener('blur', function() { setTimeout(function() { dropdown.hidden = true; }, 200); });
  inp.addEventListener('keydown', function(e) { if (e.key === 'Escape') dropdown.hidden = true; });
})();
(function() {
  var inp = document.getElementById('loc-name-input');
  var dropdown = document.getElementById('loc-name-dropdown');
  if (!inp || !dropdown) return;
  var locations = [];
  try { locations = JSON.parse(inp.dataset.locations || '[]'); } catch(e) {}
  function show(query) {
    // With the bed list showing, this field is only for naming a new bed: don't suggest old names.
    var bedSel = document.getElementById('bed-select');
    if (bedSel && !bedSel.hidden) { dropdown.hidden = true; return; }
    var q = (query || '').trim().toLowerCase();
    var matches = q ? locations.filter(function(l) { return l.toLowerCase().includes(q); }) : locations;
    if (!matches.length) { dropdown.hidden = true; return; }
    dropdown.innerHTML = '';
    matches.forEach(function(name) {
      var li = document.createElement('li');
      li.textContent = name;
      li.addEventListener('mousedown', function(e) { e.preventDefault(); inp.value = name; dropdown.hidden = true; });
      li.addEventListener('touchstart', function(e) { e.preventDefault(); inp.value = name; dropdown.hidden = true; inp.blur(); });
      dropdown.appendChild(li);
    });
    dropdown.hidden = false;
  }
  inp.addEventListener('focus', function() { show(inp.value); });
  inp.addEventListener('input', function() { show(inp.value); });
  inp.addEventListener('blur', function() { setTimeout(function() { dropdown.hidden = true; }, 200); });
  inp.addEventListener('keydown', function(e) { if (e.key === 'Escape') dropdown.hidden = true; });
})();
document.addEventListener('DOMContentLoaded', function() {
  // Once a zone is chosen, offer that zone's beds as a list, with "+ New bed…" for a new one.
  // (Runs after DOMContentLoaded: garden.js is deferred, so GP isn't ready before then.)
  var sel = document.getElementById('bed-select');
  var inp = document.getElementById('loc-name-input');
  var wrap = document.getElementById('loc-name-wrap');
  var zoneInp = document.getElementById('zone-name-input');
  var zoneHidden = document.getElementById('zone-id-hidden');
  var typeSel = document.querySelector('select[name="location_type"]');
  if (!sel || !inp || !wrap) return;
  var bedsByZone = {}, zones = [];
  try { bedsByZone = JSON.parse(sel.dataset.zoneBeds || '{}'); } catch(e) {}
  try { zones = JSON.parse((zoneInp && zoneInp.dataset.zones) || '[]'); } catch(e) {}
  var picker = GP.bedPicker(sel, inp, {
    textWrap: wrap, mirrorToText: true, freeTextWithoutBeds: true,
    onChange: function(bed) {
      // An existing bed already has its type, so only ask for one when making a new bed
      // (or when there's no bed at all).
      if (!typeSel) return;
      if (bed && bed.type) typeSel.value = bed.type;
      var field = typeSel.closest('label');
      if (field) field.hidden = !!bed;
    }
  });
  function zoneId() {
    if (zoneHidden && zoneHidden.value) return String(zoneHidden.value);
    var name = ((zoneInp && zoneInp.value) || '').trim().toLowerCase();
    var z = zones.filter(function(z) { return z.name.toLowerCase() === name; })[0];
    return z ? String(z.id) : '';
  }
  var lastZone = zoneId();
  function refresh() {
    var z = zoneId();
    if (z === lastZone && !sel.hidden) return;
    // Moving to another zone: keep a typed name, but don't carry over a bed picked from the old zone.
    var keep = sel.hidden || sel.value === '__new' ? inp.value : '';
    lastZone = z;
    picker.setBeds(bedsByZone[z] || [], keep);
  }
  if (zoneHidden) zoneHidden.addEventListener('change', refresh);
  if (zoneInp) zoneInp.addEventListener('blur', function() { setTimeout(refresh, 250); });
  picker.setBeds(bedsByZone[lastZone] || [], inp.value);
});
document.addEventListener('DOMContentLoaded', function() {
  var nameInp = document.getElementById('plant-name-input');
  if (!nameInp) return;
  var plantNames = [], plantVarieties = {};
  try { plantNames = JSON.parse(nameInp.dataset.plantNames || '[]'); } catch(e) {}
  try { plantVarieties = JSON.parse(nameInp.dataset.plantVarieties || '{}'); } catch(e) {}
  GP.setupPlantAutocomplete(
    nameInp,
    document.getElementById('plant-name-dropdown'),
    document.getElementById('variety-input'),
    document.getElementById('variety-dropdown'),
    plantNames, plantVarieties
  );
});

(function () {
  var form = document.querySelector('form');
  if (!form) return;
  var _pending = false;
  form.addEventListener('submit', function (e) {
    if (_pending || e.defaultPrevented) return;
    e.preventDefault();
    var ov = document.getElementById('gp-loading-overlay');
    var ovMsg = document.getElementById('gp-loading-msg');
    if (ovMsg) ovMsg.textContent = 'Adding plant…';
    if (ov) ov.style.display = 'flex';
    var f = form;
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        _pending = true;
        f.submit();
      });
    });
  });
})();
</script>
{% endblock %}
