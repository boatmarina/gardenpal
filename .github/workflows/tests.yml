name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Official Playwright image: Chromium, WebKit and their system libraries are preinstalled,
    # so runs don't depend on downloading ~110 apt packages (which stalled for 25+ minutes).
    # Keep the tag in sync with the playwright pin in requirements-dev.txt.
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
      options: --ipc=host

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gardenpal_test

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install -q --break-system-packages -r requirements-dev.txt

      - name: Run tests
        run: python3 -m pytest -o addopts="" -q -rfEs --show-capture=no -W ignore::DeprecationWarning
        env:
          COLUMNS: "250"

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
